<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naukri Auto Apply</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      width: 320px;
      background-color: var(--bg-color);
      color: var(--text-main);
      background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 250px);
    }

    .container {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .status-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .status-label {
      color: var(--text-muted);
    }

    .status-value {
      font-weight: 500;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.stopped {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .status-badge.running {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #startButton {
      background-color: var(--accent);
      color: white;
    }

    #startButton:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    #stopButton {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #stopButton:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icon48.png" alt="Logo">
      <h1>Naukri Auto Apply</h1>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Status</span>
        <span id="statusBadge" class="status-badge stopped">Stopped</span>
      </div>
      <div class="status-row">
        <span class="status-label">Applied Today</span>
        <span id="appliedCount" class="status-value">0</span>
      </div>
    </div>

    <div class="controls">
      <button id="startButton">Start Bot</button>
      <button id="stopButton" disabled>Stop</button>
    </div>
    
    <div class="footer">
      Please keep Naukri tab open while running
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
